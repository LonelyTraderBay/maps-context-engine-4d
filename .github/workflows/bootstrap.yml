name: bootstrap checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate bootstrap sources
        run: python -B tools/ci/bootstrap_check.py
      - name: Run positive and failure fixtures
        run: python -B tools/ci/test_bootstrap_check.py

  spec-contract:
    name: spec-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate frozen delivery plan
        run: python -B tools/ci/delivery_policy.py check-plan
      - name: Validate SPEC contracts
        run: python -B tools/spec_check/check.py
      - name: Run positive and failure fixtures
        run: python -B tools/spec_check/test_spec_check.py
      - name: Run delivery policy fixtures
        run: python -B tools/ci/test_delivery_policy.py
      - name: Verify checkpoint digest recipe
        run: python -B tools/ci/test_checkpoint_digest.py
      - name: Verify Go formatting
        run: python -B tools/ci/check_gofmt.py
      - name: Run Go contract tests
        run: go test ./...
      - name: Run Go static analysis
        run: go vet ./...
      - name: Build Go packages
        run: go build ./...

  explorer-contract:
    name: explorer-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - name: Install locked workspace dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Explorer contracts and pinned tool APIs
        run: npm run test:contract:ui
